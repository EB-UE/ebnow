name: Build and Publish Dist Folders

on:
  push:
    branches:
      - master
    paths-ignore:
      - 'birthday-list/dist/**'
      - 'birthday-preview/dist/**'
      - 'lunchlotterie-hotdog/dist/**'
      - 'qr-vcard/dist/**'
      - 'weihnachtspaeckchenaktion-christmastree/dist/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            birthday-list/package-lock.json
            birthday-preview/package-lock.json
            lunchlotterie-hotdog/package-lock.json
            qr-vcard/package-lock.json
            weihnachtspaeckchenaktion-christmastree/package-lock.json

      - name: Install and build birthday-list
        working-directory: birthday-list
        run: |
          npm install
          npm run build

      - name: Install and build birthday-preview
        working-directory: birthday-preview
        run: |
          npm install
          npm run build

      - name: Install and build lunchlotterie-hotdog
        working-directory: lunchlotterie-hotdog
        run: |
          npm install
          npm run build

      - name: Install and build qr-vcard
        working-directory: qr-vcard
        run: |
          npm install
          npm run build

      - name: Install and build weihnachtspaeckchenaktion-christmastree
        working-directory: weihnachtspaeckchenaktion-christmastree
        run: |
          npm install
          npm run build

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add birthday-list/dist birthday-preview/dist lunchlotterie-hotdog/dist qr-vcard/dist weihnachtspaeckchenaktion-christmastree/dist

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update generated dist files"
          git push origin master
